[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suitelocal"
version = "0.1.0"
description = "Sistema de ventas e inventario offline para pequeñas empresas"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "cryptography>=50.0.2,<51",
    "lxml>=6.1.3,<7",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pyright>=1.1,<2",
    "ruff>=0.8,<1",
    "pyinstaller>=6.22,<7",
]

[project.scripts]
suitelocal = "suitelocal.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-per-file-ignores = { "suitelocal/main.py" = ["E501"], "suitelocal/ui/theme/qss.py" = ["E501"] }

[tool.pyright]
include = ["suitelocal"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.setuptools.packages.find]
include = ["suitelocal*"]
